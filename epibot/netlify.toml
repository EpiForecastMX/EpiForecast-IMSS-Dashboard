[build]
  publish = "."
  functions = "netlify/functions"
  # Gate de deploy del índice RAG (rag:ci):
  #   - CON GEMINI_API_KEY: reindexa (incremental) + verifica; si la verificación
  #     detecta drift, el deploy FALLA (no se publica un índice desincronizado).
  #   - SIN key: conserva el rag_index.json commiteado y solo avisa (no falla),
  #     para no romper deploys donde la key no esté disponible.
  command = "npm install && npm run rag:ci"

[functions]
  node_bundler = "esbuild"
  # Empaqueta los datos que las funciones leen vía fs en runtime.
  included_files = ["knowledge.json", "rag_index.json"]

[[headers]]
  for = "/knowledge.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
