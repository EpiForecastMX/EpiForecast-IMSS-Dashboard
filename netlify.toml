[build]
  publish = "."
  functions = "epibot/netlify/functions"
  # Reindexa el RAG en cada deploy (incremental: reusa vectores del índice
  # commiteado, solo embebe lo nuevo). rag:ci: con GEMINI_API_KEY hace
  # build + verify (y falla el deploy si el índice queda con drift); sin key
  # conserva el rag_index.json commiteado y solo avisa (no rompe el deploy).
  # `cifras:verify` va PRIMERO y sin API key: comprueba el contrato de vocabulario
# (333 neuro · 99 dengue · 432 series · 444 gráficos) sobre el corpus y knowledge.json.
# Vive aquí y no dentro de `rag:ci` porque aquella cadena tiene un contrato propio y
# probado: sin clave NO construye pero SÍ verifica el índice commiteado, y anteponerle
# un paso que puede fallar dejaría esa verificación sin correr (el falso verde R68-P0).
command = "cd epibot && npm install && npm run cifras:test && npm run cifras:verify && npm run rag:ci"

[functions]
  node_bundler = "esbuild"
  # CRÍTICO: empaqueta los datos que las funciones leen vía fs en runtime.
  # Sin esto, rag.mjs no encuentra el índice en producción (RAG vacío).
  included_files = ["epibot/knowledge.json", "epibot/rag_index.json"]

# Compatibilidad: los enlaces viejos a /kb/ redirigen al nuevo /epibot/.
[[redirects]]
  from = "/kb/*"
  to = "/epibot/:splat"
  status = 301
  force = true

# La pagina de Dengue se renombro de dengue_fase1.html a dengue.html (cubre Fase 1 + Fase 2).
[[redirects]]
  from = "/dengue_fase1.html"
  to = "/dengue.html"
  status = 301
  force = true

[[headers]]
  for = "/epibot/knowledge.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/epibot/css/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/epibot/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Cabeceras de seguridad para todo el sitio.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache de larga duración para assets estáticos versionados/inmutables.
# (Antes todo se servía con max-age=0; una imagen de 3.6 MB se revalidaba en cada visita.)
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/Reports/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
